name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare signing key
        env:
          RIVIA_KEYSTORE_B64: ${{ secrets.RIVIA_KEYSTORE_B64 }}
          RIVIA_KEYSTORE_PASSWORD: ${{ secrets.RIVIA_KEYSTORE_PASSWORD }}
          RIVIA_KEY_ALIAS: ${{ secrets.RIVIA_KEY_ALIAS }}
        run: |
          set +x
          if [ -z "$RIVIA_KEYSTORE_B64" ] || [ -z "$RIVIA_KEYSTORE_PASSWORD" ] || [ -z "$RIVIA_KEY_ALIAS" ]; then
            echo "Signing secrets missing"
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/rivia-signing.p12"
          printf '%s' "$RIVIA_KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
          echo "RIVIA_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build
        env:
          RIVIA_KEYSTORE_PASSWORD: ${{ secrets.RIVIA_KEYSTORE_PASSWORD }}
          RIVIA_KEY_ALIAS: ${{ secrets.RIVIA_KEY_ALIAS }}
        run: gradle assembleDebug
      - name: Verify APK signature
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=""
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          fi
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH")
          echo "$CERT_OUTPUT"
          ACTUAL_SHA256=$(echo "$CERT_OUTPUT" | grep -i "certificate SHA-256 digest:" | head -n 1 | sed 's/.*certificate SHA-256 digest://I' | tr '[:upper:]' '[:lower:]' | tr -d ': \t\r\n')
          echo "Certificate SHA-256: $ACTUAL_SHA256"
          EXPECTED_SHA256="27b9a2931f802835d31d6228abd1632e2c50420cc1f3f7c9134daf15329c3b25"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "APK certificate SHA-256 mismatch: expected $EXPECTED_SHA256, got $ACTUAL_SHA256"
            exit 1
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rivia build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
      - name: Delete decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/rivia-signing.p12"
